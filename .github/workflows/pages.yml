name: Publish Xueban static website
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check published desktop installer
        id: installer
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('public/releases.json', 'utf8'));
            let available = false;
            try {
              const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: `v${manifest.version}`});
              const asset = release.assets.find(a => a.name === manifest.filename && a.size === manifest.bytes);
              const expectedDigest = `sha256:${manifest.sha256}`;
              available = !release.draft && !release.prerelease && !!asset && asset.digest === expectedDigest;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('available', String(available));
            if (!available) core.notice('Desktop release is not yet published or has a different checksum. Website tools remain available; the download button will stay unconfigured.');
      - run: pnpm build
        env:
          DESKTOP_RELEASE_AVAILABLE: ${{ steps.installer.outputs.available }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
